    var map = L.map('map').setView([10.7769, 106.7009], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19
    }).addTo(map);

    function mkIcon(e) {
      return L.divIcon({
        className: '',
        html: '<div style="position:relative;width:36px;height:42px"><div style="background:#cf3b1b;width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;"><span style="transform:rotate(45deg);font-size:14px;line-height:1">' + e + '</span></div></div>',
        iconSize:[36,42], iconAnchor:[18,42], popupAnchor:[0,-44]
      });
    }

    var markers = {};
    R.forEach(function(r) {
      var m = L.marker([r.la, r.lo], {icon: mkIcon(r.e)}).addTo(map);
      m.bindPopup(
        '<div class="pu"><div class="pu-nm">' + r.e + ' ' + r.n + '</div>' +
        '<div class="pu-row">📍 ' + r.d + '</div>' +
        '<div class="pu-row">🍽 ' + r.t + '</div>' +
        '<div class="pu-row pu-star">⭐ ' + r.r + ' / 5</div>' +
        '<a class="pu-btn" href="quan-' + r.id + '.html">Xem chi tiết →</a></div>',
        {maxWidth:260}
      );
      markers[r.id] = m;
    });

    var bdList = document.getElementById('bdList');
    var bdFt   = document.getElementById('bdFt');
    var bdCnt  = document.getElementById('bdCnt');
    R.forEach(function(r) {
      var el = document.createElement('div');
      el.className = 'bd-item';
      el.innerHTML = '<div class="bd-ico">' + r.e + '</div><div class="bd-inf"><div class="bd-nm">' + r.n + '</div><div class="bd-sb">📍 ' + r.d + ' · <span class="bd-star">★ ' + r.r + '</span></div></div>';
      el.addEventListener('click', function() {
        document.querySelectorAll('.bd-item').forEach(function(x){ x.classList.remove('on'); });
        el.classList.add('on');
        map.setView([r.la, r.lo], 16, {animate:true});
        markers[r.id].openPopup();
      });
      bdList.appendChild(el);
    });
    bdCnt.textContent = R.length + ' quán';
    bdFt.textContent  = 'Hiển thị ' + R.length + ' quán trên bản đồ';

    /* ── Tìm kiếm trong sidebar ── */
    function filterBdList(query) {
      var q = query.toLowerCase().trim();
      var shown = 0;
      bdList.querySelectorAll('.bd-item').forEach(function(el, i) {
        var name = R[i].n.toLowerCase();
        var vis  = !q || name.includes(q);
        el.style.display = vis ? '' : 'none';
        if (vis) shown++;
      });
      bdFt.textContent = q
        ? 'Tìm thấy ' + shown + ' quán'
        : 'Hiển thị ' + R.length + ' quán trên bản đồ';
    }

    var uM=null, uC=null;
    document.getElementById('locBtn').addEventListener('click', function() {
      if (!navigator.geolocation) { alert('Trình duyệt không hỗ trợ định vị.'); return; }
      navigator.geolocation.getCurrentPosition(function(p) {
        var lt=p.coords.latitude, ln=p.coords.longitude, ac=p.coords.accuracy;
        if (uM) map.removeLayer(uM);
        if (uC) map.removeLayer(uC);
        uM = L.circleMarker([lt,ln],{radius:9,color:'#fff',fillColor:'#1976d2',fillOpacity:1,weight:3}).addTo(map).bindPopup('<strong>📍 Vị trí của bạn</strong>').openPopup();
        uC = L.circle([lt,ln],{radius:ac,color:'#1976d2',fillColor:'#1976d2',fillOpacity:.1,weight:1}).addTo(map);
        map.setView([lt,ln], 15, {animate:true});
      }, function(err){ alert('Không lấy được vị trí: ' + err.message); }, {enableHighAccuracy:true,timeout:8000});
    });

    (function(){
      var b=document.getElementById('hbBtn'), l=document.getElementById('navLinks');
      b.addEventListener('click',function(){var o=l.classList.toggle('open');b.setAttribute('aria-expanded',o);b.classList.toggle('active',o);});
    })();

    setTimeout(function(){ map.invalidateSize(); }, 200);
    window.addEventListener('resize', function(){ map.invalidateSize(); });
  </script>
</body>
</html>
